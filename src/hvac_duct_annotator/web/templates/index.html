<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HVAC Duct Annotator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 920px; line-height: 1.35; }
    .card { border: 1px solid #e2e2e2; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .dropzone { border: 2px dashed #5d7; padding: 1.25rem; border-radius: 12px; background: #fcfffd; }
    .dropzone.dragover { border-color: #1f8f5c; background: #f1fff8; }
    .muted { color: #666; }
    a { margin-right: 1rem; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.75rem; }
    button { background: #1976d2; color: white; border: none; border-radius: 8px; padding: 0.5rem 0.8rem; cursor: pointer; }
    button:disabled { background: #a8a8a8; cursor: not-allowed; }
    .kv { display: grid; grid-template-columns: 180px 1fr; gap: 0.3rem 0.75rem; margin-top: 0.7rem; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 12px; background: #eef2ff; color: #223; }
    code { background: #f5f5f5; padding: 0.15rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>HVAC Duct Annotator</h1>
  <p class="muted">Upload a mechanical drawing PDF, monitor pipeline status, then download annotated output and review low-confidence items.</p>

  <div class="card">
    <div id="dropzone" class="dropzone">
      <strong>Drop PDF here</strong> or choose file below.
      <div class="row">
        <input id="file" type="file" accept="application/pdf" />
        <button id="submit">Start Job</button>
      </div>
      <p id="picked" class="muted" style="margin: 0.6rem 0 0 0;"></p>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="pill">Pipeline Status</span>
      <strong id="status">Idle</strong>
    </div>
    <div class="kv">
      <div class="muted">Job ID</div><div id="jobId">-</div>
      <div class="muted">Segments Detected</div><div id="segmentsTotal">-</div>
      <div class="muted">Review Queue</div><div id="reviewQueue">-</div>
    </div>
  </div>

  <div id="links" class="card"></div>
  <script src="/static/app.js"></script>
</body>
</html>
