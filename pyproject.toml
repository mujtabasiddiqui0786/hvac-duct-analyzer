[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-duct-annotator"
version = "0.1.0"
description = "Automated HVAC duct detection and annotation from PDF mechanical drawings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "networkx>=3.3",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0.84",
  "pydantic>=2.8.2",
  "pymupdf>=1.24.9",
  "python-multipart>=0.0.9",
  "easyocr>=1.7.2",
  "scikit-image>=0.24.0",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
hvac-annotate = "hvac_duct_annotator.cli:main"
hvac-annotate-web = "hvac_duct_annotator.web.app:run_dev"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
